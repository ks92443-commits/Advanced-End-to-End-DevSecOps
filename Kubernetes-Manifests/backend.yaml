apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: three-tier
spec:
  selector:
    app: backend
  ports:
    - port: 3500
      targetPort: 3500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 605199372964.dkr.ecr.us-east-1.amazonaws.com/backend:1
          ports:
            - containerPort: 3500
          env:
            - name: PORT
              value: "3500"
            - name: MONGO_CONN_STR
              value: "mongodb://mongodb-svc.three-tier.svc.cluster.local:27017/taskdb"
